[package]
name = "ht2-game"
description = "Drivable prototype for Hard Truck 2 data"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
ht2-formats = { path = "../ht2-formats" }
ht2-render = { path = "../ht2-render" }
ht2-sim = { path = "../ht2-sim" }
wgpu = "24"
winit = "0.30"
pollster = "0.4"
glam = "0.29"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Media_Audio", "Win32_System_Threading", "Win32_Security"] }
